<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Salud Pulmonar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }
        
        .chat-container {
            max-width: 800px;
            height: 100vh;
            margin: 0 auto;
            background-color: #E5DDD5;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .chat-header {
            background-color: #0088CC;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            position: sticky;
            top: 0;
            z-index: 10;
            flex-shrink: 0;
        }
        
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #E5DDD5;
            padding-bottom: 80px; /* Espacio para la caja de entrada */
            display: flex;
            flex-direction: column;
        }
        
        .message {
            margin-bottom: 15px;
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .bot-message {
            background-color: white;
            align-self: flex-start;
            border-top-left-radius: 5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .user-message {
            background-color: #DCF8C6;
            align-self: flex-end;
            border-top-right-radius: 5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .message-sender {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        
        .message-time {
            font-size: 11px;
            color: #999;
            text-align: right;
            margin-top: 8px;
        }
        
        .chat-input-container {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            background-color: #E5DDD5;
            padding: 15px;
            border-top: 1px solid #ddd;
            z-index: 100;
            box-sizing: border-box;
        }
        
        .chat-input {
            display: flex;
            width: 100%;
            gap: 10px;
            align-items: center;
        }
        
        #user-input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #ccc;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            background-color: white;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        #user-input:focus {
            border-color: #0088CC;
            box-shadow: 0 0 0 2px rgba(0, 136, 204, 0.1);
        }
        
        #send-button {
            background-color: #0088CC;
            color: white;
            border: none;
            border-radius: 24px;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            white-space: nowrap;
            min-width: 80px;
        }
        
        #send-button:hover {
            background-color: #0077BB;
        }
        
        #send-button:active {
            transform: scale(0.98);
        }
        
        .welcome-message {
            background-color: white;
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 15px;
            white-space: pre-line;
            border-left: 4px solid #0088CC;
        }
        
        .chart-container {
            max-width: 100%;
            margin: 10px 0;
        }
        
        .chart-container img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        /* Estilos para mensajes de evaluación de riesgo */
        .risk-options {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .risk-option-button {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
        }
        
        .risk-option-button:hover {
            background-color: #e9ecef;
            border-color: #0088CC;
        }
        
        .progress-indicator {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            text-align: center;
            font-style: italic;
        }
        
        .risk-result {
            background-color: white;
            border-left: 4px solid #0088CC;
            padding: 16px;
            border-radius: 12px;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .risk-high {
            border-left-color: #e74c3c;
        }
        
        .risk-moderate {
            border-left-color: #f39c12;
        }
        
        .risk-low {
            border-left-color: #27ae60;
        }
        
        /* Scrollbar personalizado */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        /* Indicador de nuevos mensajes */
        .new-message-indicator {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0088CC;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .new-message-indicator.show {
            opacity: 1;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                max-width: 100%;
            }
            
            .chat-header {
                padding: 12px;
                font-size: 16px;
            }
            
            .chat-messages {
                padding: 10px;
                padding-bottom: 70px;
            }
            
            .message {
                max-width: 90%;
                padding: 10px 14px;
            }
            
            .chat-input-container {
                padding: 10px;
                padding-bottom: max(10px, env(safe-area-inset-bottom));
            }
            
            #user-input {
                padding: 10px 16px;
                font-size: 16px; /* Mejor para móviles */
            }
            
            #send-button {
                padding: 10px 16px;
                min-width: 70px;
            }
            
            .risk-options {
                flex-direction: column;
            }
            
            .risk-option-button {
                width: 100%;
                text-align: center;
            }
        }
        
        /* Mejoras para dispositivos muy pequeños */
        @media (max-width: 480px) {
            .chat-header {
                padding: 10px;
                font-size: 15px;
            }
            
            .message {
                max-width: 95%;
                padding: 8px 12px;
            }
            
            .message-sender {
                font-size: 13px;
            }
            
            .chat-input-container {
                padding: 8px;
                padding-bottom: max(8px, env(safe-area-inset-bottom));
            }
            
            #user-input {
                padding: 8px 14px;
            }
            
            #send-button {
                padding: 8px 14px;
                min-width: 60px;
                font-size: 14px;
            }
        }
        
        /* Soporte para dispositivos con muesca */
        @supports(padding: max(0px)) {
            .chat-input-container {
                padding-bottom: max(15px, env(safe-area-inset-bottom));
            }
            
            @media (max-width: 768px) {
                .chat-input-container {
                    padding-bottom: max(10px, env(safe-area-inset-bottom));
                }
            }
            
            @media (max-width: 480px) {
                .chat-input-container {
                    padding-bottom: max(8px, env(safe-area-inset-bottom));
                }
            }
        }
        
        /* Efectos de carga */
        .typing-indicator {
            display: inline-block;
            padding: 12px 16px;
            background-color: white;
            border-radius: 18px;
            border-top-left-radius: 5px;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: #999;
            border-radius: 50%;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typingAnimation {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* Indicador de reconexión */
        .connection-status {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #f39c12;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 14px;
            z-index: 1000;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }
        
        .connection-status.show {
            transform: translateY(0);
        }
        
        .connection-status.online {
            background-color: #27ae60;
        }
        
        .connection-status.offline {
            background-color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connection-status"></div>
    
    <div class="chat-container">
        <div class="chat-header">Asistente de Salud Pulmonar</div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message welcome-message bot-message">
                <div class="message-sender">Asistente</div>
                {{ welcome_message }}
                <div class="message-time">{{ current_time }}</div>
            </div>
        </div>
        
        <div class="new-message-indicator" id="new-message-indicator">
            Nuevos mensajes ↓
        </div>
        
        <div class="chat-input-container">
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
                <button id="send-button">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const newMessageIndicator = document.getElementById('new-message-indicator');
            const connectionStatus = document.getElementById('connection-status');
            
            let isAtBottom = true;
            let typingIndicator = null;
            let chatHistory = [];
            let isOnline = true;
            
            // Cargar historial desde localStorage
            function loadChatHistory() {
                const savedHistory = localStorage.getItem('lungHealthChatHistory');
                if (savedHistory) {
                    try {
                        chatHistory = JSON.parse(savedHistory);
                        
                        // Limpiar mensajes actuales excepto el de bienvenida
                        const welcomeMessage = chatMessages.querySelector('.welcome-message');
                        chatMessages.innerHTML = '';
                        if (welcomeMessage) {
                            chatMessages.appendChild(welcomeMessage);
                        }
                        
                        // Reconstruir el historial de mensajes
                        chatHistory.forEach(msg => {
                            addMessageToDOM(msg.sender, msg.content, msg.isBot, msg.options, msg.progress, msg.timestamp, true);
                        });
                        
                        scrollToBottom();
                    } catch (e) {
                        console.error('Error al cargar el historial del chat:', e);
                    }
                }
            }
            
            // Guardar historial en localStorage
            function saveChatHistory() {
                try {
                    localStorage.setItem('lungHealthChatHistory', JSON.stringify(chatHistory));
                } catch (e) {
                    console.error('Error al guardar el historial del chat:', e);
                }
            }
            
            // Función para verificar si el scroll está al final
            function checkScrollPosition() {
                const threshold = 100; // pixels from bottom
                const position = chatMessages.scrollTop + chatMessages.clientHeight;
                const height = chatMessages.scrollHeight;
                isAtBottom = height - position <= threshold;
                
                // Mostrar/ocultar indicador de nuevos mensajes
                if (!isAtBottom) {
                    newMessageIndicator.classList.add('show');
                } else {
                    newMessageIndicator.classList.remove('show');
                }
            }
            
            // Scroll al final
            function scrollToBottom() {
                chatMessages.scrollTop = chatMessages.scrollHeight;
                isAtBottom = true;
                newMessageIndicator.classList.remove('show');
            }
            
            // Función para mostrar indicador de typing
            function showTypingIndicator() {
                if (typingIndicator) return;
                
                typingIndicator = document.createElement('div');
                typingIndicator.className = 'message bot-message typing-indicator';
                typingIndicator.innerHTML = `
                    <div class="message-sender">Asistente</div>
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                `;
                chatMessages.appendChild(typingIndicator);
                scrollToBottom();
            }
            
            // Función para ocultar indicador de typing
            function hideTypingIndicator() {
                if (typingIndicator) {
                    typingIndicator.remove();
                    typingIndicator = null;
                }
            }
            
            // Función para agregar un mensaje al DOM
            function addMessageToDOM(sender, message, isBot = false, options = null, progress = null, timestamp = null, fromHistory = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isBot ? 'bot-message' : 'user-message'}`;
                
                // Procesar saltos de línea y emojis
                message = message.replace(/\n/g, '<br>');
                
                // Usar timestamp proporcionado o crear uno nuevo
                const messageTime = timestamp ? new Date(timestamp) : new Date();
                const timeString = messageTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                let messageContent = `
                    <div class="message-sender">${sender}</div>
                    <div class="message-content">${message}</div>
                `;
                
                // Agregar opciones si existen
                if (options && options.length > 0) {
                    messageContent += `<div class="risk-options">`;
                    options.forEach(option => {
                        messageContent += `<button class="risk-option-button" data-value="${option}">${option}</button>`;
                    });
                    messageContent += `</div>`;
                }
                
                // Agregar indicador de progreso si existe
                if (progress) {
                    messageContent += `<div class="progress-indicator">${progress}</div>`;
                }
                
                messageContent += `<div class="message-time">${timeString}</div>`;
                
                messageDiv.innerHTML = messageContent;
                
                // Ocultar indicador de typing si existe y no estamos cargando desde el historial
                if (!fromHistory) {
                    hideTypingIndicator();
                }
                
                chatMessages.appendChild(messageDiv);
                
                // Scroll automático solo si estaba al final y no estamos cargando desde el historial
                if (isAtBottom && !fromHistory) {
                    scrollToBottom();
                }
                
                // Agregar event listeners a los botones de opciones
                if (options && options.length > 0) {
                    setTimeout(() => {
                        const optionButtons = messageDiv.querySelectorAll('.risk-option-button');
                        optionButtons.forEach(button => {
                            button.addEventListener('click', function() {
                                userInput.value = this.getAttribute('data-value');
                                sendMessage();
                            });
                        });
                    }, 100);
                }
            }
            
            // Función para agregar un mensaje al chat y al historial
            function addMessage(sender, message, isBot = false, options = null, progress = null) {
                const timestamp = new Date().toISOString();
                
                // Agregar al historial
                chatHistory.push({
                    sender: sender,
                    content: message,
                    isBot: isBot,
                    options: options,
                    progress: progress,
                    timestamp: timestamp
                });
                
                // Guardar historial
                saveChatHistory();
                
                // Agregar al DOM
                addMessageToDOM(sender, message, isBot, options, progress, timestamp);
            }
            
            // Enviar mensaje al presionar Enter o el botón
            function sendMessage() {
                const message = userInput.value.trim();
                if (message === '') return;
                
                addMessage('Tú', message, false);
                userInput.value = '';
                
                // Mostrar indicador de typing
                showTypingIndicator();
                
                // Enviar al servidor
                fetch('/send_message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                })
                .then(response => response.json())
                .then(data => {
                    // Manejar respuesta del servidor
                    if (data.risk_assessment_active) {
                        // Mostrar pregunta con opciones si existen
                        let options = null;
                        if (data.risk_question_data && data.risk_question_data.options) {
                            options = data.risk_question_data.options;
                        }
                        
                        addMessage('Asistente', data.bot_response, true, options, 
                                  data.risk_question_data ? data.risk_question_data.progress : null);
                    } else {
                        // Verificar si es un resultado de evaluación de riesgo
                        if (data.bot_response.includes('EVALUACIÓN COMPLETADA')) {
                            // Aplicar formato especial para resultados de riesgo
                            const resultDiv = document.createElement('div');
                            resultDiv.className = 'message bot-message risk-result';
                            
                            // Determinar nivel de riesgo para aplicar clase CSS
                            let riskClass = '';
                            if (data.bot_response.includes('ALTO')) {
                                riskClass = 'risk-high';
                            } else if (data.bot_response.includes('MODERADO')) {
                                riskClass = 'risk-moderate';
                            } else if (data.bot_response.includes('BAJO')) {
                                riskClass = 'risk-low';
                            }
                            
                            resultDiv.classList.add(riskClass);
                            
                            const timestamp = new Date().toISOString();
                            const timeString = new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                            
                            resultDiv.innerHTML = `
                                <div class="message-sender">Asistente</div>
                                <div class="message-content">${data.bot_response.replace(/\n/g, '<br>')}</div>
                                <div class="message-time">${timeString}</div>
                            `;
                            
                            // Agregar al historial
                            chatHistory.push({
                                sender: 'Asistente',
                                content: data.bot_response,
                                isBot: true,
                                options: null,
                                progress: null,
                                timestamp: timestamp,
                                isRiskResult: true,
                                riskClass: riskClass
                            });
                            
                            // Guardar historial
                            saveChatHistory();
                            
                            chatMessages.appendChild(resultDiv);
                            
                            // Scroll automático solo si estaba al final
                            if (isAtBottom) {
                                scrollToBottom();
                            }
                        } else {
                            addMessage('Asistente', data.bot_response, true);
                        }
                    }
                })
                .catch(error => {
                    hideTypingIndicator();
                    addMessage('Asistente', 'Lo siento, hubo un error al procesar tu mensaje. Por favor, verifica tu conexión a internet.', true);
                    console.error('Error:', error);
                });
            }
            
            // Manejo de estado de conexión
            function updateOnlineStatus() {
                isOnline = navigator.onLine;
                
                if (isOnline) {
                    connectionStatus.textContent = 'Conexión restaurada';
                    connectionStatus.className = 'connection-status show online';
                    
                    setTimeout(() => {
                        connectionStatus.classList.remove('show');
                    }, 3000);
                } else {
                    connectionStatus.textContent = 'Sin conexión. Los mensajes se guardarán localmente.';
                    connectionStatus.className = 'connection-status show offline';
                }
            }
            
            // Event Listeners
            sendButton.addEventListener('click', sendMessage);
            
            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Scroll automático cuando se hace clic en el indicador de nuevos mensajes
            newMessageIndicator.addEventListener('click', scrollToBottom);
            
            // Verificar posición del scroll
            chatMessages.addEventListener('scroll', checkScrollPosition);
            
            // Eventos de conexión
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
            
            // Auto-enfocar el input
            userInput.focus();
            
            // Re-enfocar el input después de enviar mensaje o hacer clic
            document.addEventListener('click', function() {
                userInput.focus();
            });
            
            // Cargar historial al iniciar
            loadChatHistory();
            
            // Scroll inicial al final
            setTimeout(scrollToBottom, 100);
            
            // Verificar estado de conexión inicial
            updateOnlineStatus();
        });
    </script>
</body>
</html>
