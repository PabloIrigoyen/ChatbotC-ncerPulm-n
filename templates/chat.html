<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Salud Pulmonar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }
        
        .chat-container {
            max-width: 800px;
            height: 100vh;
            margin: 0 auto;
            background-color: #E5DDD5;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .chat-header {
            background-color: #0088CC;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            position: sticky;
            top: 0;
            z-index: 10;
            flex-shrink: 0;
        }
        
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #E5DDD5;
            padding-bottom: 80px; /* Espacio para la caja de entrada */
        }
        
        .message {
            margin-bottom: 15px;
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .bot-message {
            background-color: white;
            align-self: flex-start;
            margin-right: auto;
            border-top-left-radius: 5px;
        }
        
        .user-message {
            background-color: #DCF8C6;
            align-self: flex-end;
            margin-left: auto;
            border-top-right-radius: 5px;
        }
        
        .message-sender {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .message-time {
            font-size: 11px;
            color: #666;
            text-align: right;
            margin-top: 5px;
        }
        
        .chat-input-container {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            background-color: #E5DDD5;
            padding: 10px;
            border-top: 1px solid #ddd;
            z-index: 100;
        }
        
        .chat-input {
            display: flex;
            width: 100%;
        }
        
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #0088CC;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        
        #send-button {
            background-color: #0088CC;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 0 20px;
            margin-left: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        
        #send-button:hover {
            background-color: #0077BB;
        }
        
        .welcome-message {
            background-color: white;
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 15px;
            white-space: pre-line;
        }
        
        .chart-container {
            max-width: 100%;
            margin: 10px 0;
        }
        
        .chart-container img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .risk-options {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .risk-option-button {
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .risk-option-button:hover {
            background-color: #e0e0e0;
        }
        
        .progress-indicator {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            text-align: center;
        }
        
        .risk-result {
            background-color: white;
            border-left: 4px solid #0088CC;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .risk-high {
            border-left-color: #e74c3c;
        }
        
        .risk-moderate {
            border-left-color: #f39c12;
        }
        
        .risk-low {
            border-left-color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Asistente de Salud Pulmonar</div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message welcome-message bot-message">
                <div class="message-sender">Asistente</div>
                {{ welcome_message }}
                <div class="message-time">{{ current_time }}</div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Escribe tu mensaje aquí...">
                <button id="send-button">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            
            let riskAssessmentActive = false;
            let currentRiskQuestion = null;
            
            // Función para agregar un mensaje al chat
            function addMessage(sender, message, isBot = false, options = null, progress = null) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isBot ? 'bot-message' : 'user-message'}`;
                
                // Procesar saltos de línea y emojis
                message = message.replace(/\n/g, '<br>');
                
                let messageContent = `
                    <div class="message-sender">${sender}</div>
                    <div class="message-content">${message}</div>
                `;
                
                // Agregar opciones si existen
                if (options && options.length > 0) {
                    messageContent += `<div class="risk-options">`;
                    options.forEach(option => {
                        messageContent += `<button class="risk-option-button" data-value="${option}">${option}</button>`;
                    });
                    messageContent += `</div>`;
                }
                
                // Agregar indicador de progreso si existe
                if (progress) {
                    messageContent += `<div class="progress-indicator">${progress}</div>`;
                }
                
                messageContent += `<div class="message-time">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>`;
                
                messageDiv.innerHTML = messageContent;
                
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                // Agregar event listeners a los botones de opciones
                if (options && options.length > 0) {
                    setTimeout(() => {
                        const optionButtons = messageDiv.querySelectorAll('.risk-option-button');
                        optionButtons.forEach(button => {
                            button.addEventListener('click', function() {
                                userInput.value = this.getAttribute('data-value');
                                sendMessage();
                            });
                        });
                    }, 100);
                }
            }
            
            // Enviar mensaje al presionar Enter o el botón
            function sendMessage() {
                const message = userInput.value.trim();
                if (message === '') return;
                
                addMessage('Tú', message, false);
                userInput.value = '';
                
                // Enviar al servidor
                fetch('/send_message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                })
                .then(response => response.json())
                .then(data => {
                    // Manejar respuesta del servidor
                    if (data.risk_assessment_active) {
                        riskAssessmentActive = true;
                        currentRiskQuestion = data.risk_question_data;
                        
                        // Mostrar pregunta con opciones si existen
                        let options = null;
                        if (currentRiskQuestion && currentRiskQuestion.options) {
                            options = currentRiskQuestion.options;
                        }
                        
                        addMessage('Asistente', data.bot_response, true, options, 
                                  currentRiskQuestion ? currentRiskQuestion.progress : null);
                    } else {
                        riskAssessmentActive = false;
                        currentRiskQuestion = null;
                        
                        // Verificar si es un resultado de evaluación de riesgo
                        if (data.bot_response.includes('EVALUACIÓN COMPLETADA')) {
                            // Aplicar formato especial para resultados de riesgo
                            const resultDiv = document.createElement('div');
                            resultDiv.className = 'message bot-message risk-result';
                            
                            // Determinar nivel de riesgo para aplicar clase CSS
                            let riskClass = '';
                            if (data.bot_response.includes('ALTO')) {
                                riskClass = 'risk-high';
                            } else if (data.bot_response.includes('MODERADO')) {
                                riskClass = 'risk-moderate';
                            } else if (data.bot_response.includes('BAJO')) {
                                riskClass = 'risk-low';
                            }
                            
                            resultDiv.classList.add(riskClass);
                            resultDiv.innerHTML = `
                                <div class="message-sender">Asistente</div>
                                <div class="message-content">${data.bot_response.replace(/\n/g, '<br>')}</div>
                                <div class="message-time">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                            `;
                            
                            chatMessages.appendChild(resultDiv);
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        } else {
                            addMessage('Asistente', data.bot_response, true);
                        }
                    }
                })
                .catch(error => {
                    addMessage('Asistente', 'Lo siento, hubo un error al procesar tu mensaje.', true);
                    console.error('Error:', error);
                });
            }
            
            sendButton.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Asegurar que el input esté siempre enfocado
            userInput.focus();
            
            // Re-enfocar el input después de enviar mensaje
            document.addEventListener('click', function() {
                userInput.focus();
            });
        });
    </script>
</body>
</html>
