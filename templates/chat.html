<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Salud Pulmonar</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #E5DDD5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .chat-header {
            background-color: #0088CC;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #E5DDD5;
            padding-bottom: 70px; /* Espacio para la caja de entrada */
        }
        
        .message {
            margin-bottom: 15px;
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .bot-message {
            background-color: white;
            align-self: flex-start;
            margin-right: auto;
            border-top-left-radius: 5px;
        }
        
        .user-message {
            background-color: #DCF8C6;
            align-self: flex-end;
            margin-left: auto;
            border-top-right-radius: 5px;
        }
        
        .message-sender {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .message-time {
            font-size: 11px;
            color: #666;
            text-align: right;
            margin-top: 5px;
        }
        
        .chat-input-container {
            position: sticky;
            bottom: 0;
            width: 100%;
            background-color: #E5DDD5;
            padding: 10px;
            border-top: 1px solid #ddd;
            box-sizing: border-box;
        }
        
        .chat-input {
            display: flex;
            max-width: 800px;
            margin: 0 auto;
        }
        
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #0088CC;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        
        #send-button {
            background-color: #0088CC;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 0 20px;
            margin-left: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        #send-button:hover {
            background-color: #0077BB;
        }
        
        .welcome-message {
            background-color: white;
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 15px;
            white-space: pre-line;
        }
        
        .chart-container {
            max-width: 100%;
            margin: 10px 0;
        }
        
        .chart-container img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Asistente de Salud Pulmonar</div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message welcome-message bot-message">
                <div class="message-sender">Asistente</div>
                Bienvenido al Asistente de Salud Pulmonar. Estoy aquí para ayudarte con información sobre la salud de tus pulmones, síntomas respiratorios y recomendaciones para mantener una buena salud pulmonar. ¿En qué puedo ayudarte hoy?
                <div class="message-time">10:00 AM</div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Escribe tu mensaje aquí...">
                <button id="send-button">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            
            // Función para agregar un mensaje al chat
            function addMessage(sender, message, isBot = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isBot ? 'bot-message' : 'user-message'}`;
                
                // Procesar saltos de línea y emojis
                message = message.replace(/\n/g, '<br>');
                
                messageDiv.innerHTML = `
                    <div class="message-sender">${sender}</div>
                    <div class="message-content">${message}</div>
                    <div class="message-time">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                `;
                
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            // Enviar mensaje al presionar Enter o el botón
            function sendMessage() {
                const message = userInput.value.trim();
                if (message === '') return;
                
                addMessage('Tú', message, false);
                userInput.value = '';
                
                // Simular respuesta del bot
                setTimeout(() => {
                    const responses = [
                        "Entiendo tu consulta. ¿Podrías proporcionar más detalles sobre tus síntomas?",
                        "Para evaluar mejor tu situación, ¿podrías decirme desde cuándo experimentas estos síntomas?",
                        "Es importante consultar con un profesional de la salud para un diagnóstico preciso. ¿Te gustaría que te proporcione información sobre especialistas en tu área?",
                        "Mantener una buena salud pulmonar incluye evitar el tabaco, realizar ejercicio regularmente y mantener una dieta equilibrada. ¿Te interesa conocer más sobre hábitos saludables?"
                    ];
                    const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                    addMessage('Asistente', randomResponse, true);
                }, 1000);
            }
            
            sendButton.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
